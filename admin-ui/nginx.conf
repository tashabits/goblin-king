server {
  listen 8080;
  server_name _;
  absolute_redirect off;
  port_in_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  location = / {
    return 302 /admin/;
  }

  location = /admin {
    return 302 /admin/;
  }

  location = /services/goblin-king {
    return 302 /services/goblin-king/;
  }

  location = /favicon.ico {
    return 204;
  }

  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
  }

  location /services/goblin-king/admin-api/ {
    proxy_pass http://${API_UPSTREAM}/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /services/goblin-king/admin-ws/ {
    proxy_pass http://${API_UPSTREAM}/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location /services/goblin-king/ {
    rewrite ^/services/goblin-king/(.*)$ /admin/$1 break;
    try_files $uri $uri/ /admin/index.html;
  }

  location /admin-api/ {
    proxy_pass http://${API_UPSTREAM}/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /admin-ws/ {
    proxy_pass http://${API_UPSTREAM}/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}
