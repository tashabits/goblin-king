[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "goblin-king"
version = "0.1.0"
description = "A scheduler/control plane for contract-compliant Docker task containers."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "croniter>=2.0,<7",
    "fastapi>=0.115,<1",
    "kubernetes>=29,<34",
    "pyjwt[crypto]>=2.8,<3",
    "pydantic>=2.7,<3",
    "redis>=5,<7",
    "sqlalchemy>=2.0,<3",
    "typer>=0.12,<1",
    "uvicorn>=0.30,<1",
    "websockets>=12,<16",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
goblin-king = "goblin_king.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/goblin_king"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
