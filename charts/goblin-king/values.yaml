image:
  repository: goblin-king
  tag: local
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

api:
  replicas: 1
  port: 8000
  bootstrapAdminToken: local-dev-token
  existingSecret: ""
  existingSecretBootstrapTokenKey: bootstrap-admin-token
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

scheduler:
  enabled: true
  replicas: 1
  intervalSeconds: 5
  runtime: kubernetes
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

redis:
  image: redis:7-alpine
  port: 6379
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

config:
  registryPath: /app/demo-goblins.json
  imagesPath: /app/demo-images.json
  projectSettingsPath: ""
  dbPath: /data/goblin-king.sqlite3
  artifactRoot: /data/artifacts
  redisUrl: redis://goblin-king-redis:6379/0
  oidc:
    enabled: false
    issuer: ""
    audience: ""
    jwksUrl: ""
    clockSkewSeconds: 60
    userClaim: sub
    emailClaim: email
    roleClaim: goblin_king_role
    projectClaim: goblin_king_project_id
    adminRoles:
      - admin

project:
  extraVolumes: []
  extraVolumeMounts: []

admin:
  enabled: true
  image:
    repository: goblin-king-admin-ui
    tag: local
    pullPolicy: IfNotPresent
  port: 8080
  longHelloUrl: http://goblin-king-long-hello
  replicas: 1
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  ingress:
    enabled: true
    className: nginx
    host: goblin-king.local
    path: /
    pathType: Prefix
    annotations: {}
    tls: []

workers:
  exampleLongHello:
    enabled: true
    image: goblin-king-example-long-hello:local
    port: 8080
    pullPolicy: IfNotPresent
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  extraLongServices: []

networkPolicy:
  enabled: false
  ingressNamespaceSelector: {}
  egress:
    enabled: true
