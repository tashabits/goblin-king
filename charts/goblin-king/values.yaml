image:
  repository: goblin-king
  tag: local
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

podSecurityContext: {}

securityContext: {}

api:
  replicas: 1
  port: 8000
  bootstrapAdminToken: local-dev-token
  existingSecret: ""
  existingSecretBootstrapTokenKey: bootstrap-admin-token
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

scheduler:
  enabled: true
  replicas: 1
  intervalSeconds: 5
  runtime: kubernetes
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

redis:
  image: redis:7-alpine
  port: 6379
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

config:
  registryPath: /app/demo-goblins.json
  imagesPath: /app/demo-images.json
  projectSettingsPath: ""
  resourcePoliciesPath: /config/goblin-resource-policies.json
  dbPath: /data/goblin-king.sqlite3
  artifactRoot: /data/artifacts
  redisUrl: redis://goblin-king-redis:6379/0
  oidc:
    enabled: false
    issuer: ""
    audience: ""
    jwksUrl: ""
    clockSkewSeconds: 60
    userClaim: sub
    emailClaim: email
    roleClaim: goblin_king_role
    projectClaim: goblin_king_project_id
    adminRoles:
      - admin

resourcePolicies:
  version: 1
  defaults:
    timeout_seconds: 60
    max_retries: 0
    cpu:
      request: 100m
      limit: "1"
    memory:
      request: 64Mi
      limit: 512Mi
    process:
      pids_limit: 256
    filesystem:
      read_only_root: false
      artifact_max_bytes: 10485760
      artifact_max_files: 20
    logs:
      max_bytes: 1048576
    concurrency:
      max_running: 10
  goblins:
    example.behavior-python-slow-cancellable:
      timeout_seconds: 120
    example.long-hello:
      timeout_seconds: 120
  ceilings:
    timeout_seconds: 3600
    max_retries: 5
    cpu:
      limit: "2"
    memory:
      limit: 2Gi
    process:
      pids_limit: 512
    filesystem:
      artifact_max_bytes: 1073741824
      artifact_max_files: 1000
    logs:
      max_bytes: 10485760
    concurrency:
      max_running: 25

project:
  extraVolumes: []
  extraVolumeMounts: []

admin:
  enabled: true
  image:
    repository: goblin-king-admin-ui
    tag: local
    pullPolicy: IfNotPresent
  port: 8080
  longHelloUrl: http://goblin-king-long-hello
  replicas: 1
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  ingress:
    enabled: true
    className: nginx
    host: goblin-king.local
    path: /
    pathType: Prefix
    annotations: {}
    tls: []

workers:
  exampleLongHello:
    enabled: true
    image: goblin-king-example-long-hello:local
    port: 8080
    pullPolicy: IfNotPresent
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  extraLongServices: []

networkPolicy:
  enabled: false
  ingressNamespaceSelector: {}
  egress:
    enabled: true
