{{- $repositoryUrl := include "goblin-king.repositoryUrl" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "goblin-king.fullname" . }}-config
data:
  goblin-king-api.json: |
    {
      "registry": "{{ .Values.config.registryPath }}",
      "images": "{{ .Values.config.imagesPath }}",
      "db": "{{ .Values.config.dbPath }}",
      "redis_url": "{{ .Values.config.redisUrl }}",
      "artifact_root": "{{ .Values.config.artifactRoot }}",
      "resource_policies": "{{ .Values.config.resourcePoliciesPath }}",
      "notebook_function_image": "{{ .Values.config.notebookFunctionImage }}",
      "notebook_service_image": "{{ .Values.config.notebookServiceImage }}",
      "notebook_service_runtime": "{{ .Values.config.notebookServiceRuntime }}",
      "bootstrap_admin_token": "{{ .Values.api.bootstrapAdminToken }}",
      "repository": {
        "enabled": {{ .Values.repository.enabled }},
        "url": {{ if $repositoryUrl }}{{ $repositoryUrl | quote }}{{ else }}null{{ end }}
      },
      "kubernetes_runtime": {
        "result_forwarder_image": {{ include "goblin-king.resultForwarderImage" . | quote }},
        "worker_image_pull_policy": {{ include "goblin-king.workerImagePullPolicy" . | quote }},
        "result_forwarder_image_pull_policy": {{ include "goblin-king.resultForwarderImagePullPolicy" . | quote }},
        "workload_image_pull_secret_names": {{ include "goblin-king.workloadImagePullSecretNames" . }}
      },
      "oidc": {
        "enabled": {{ .Values.config.oidc.enabled }},
        "issuer": {{ if .Values.config.oidc.issuer }}{{ .Values.config.oidc.issuer | quote }}{{ else }}null{{ end }},
        "audience": {{ if .Values.config.oidc.audience }}{{ .Values.config.oidc.audience | quote }}{{ else }}null{{ end }},
        "jwks_url": {{ if .Values.config.oidc.jwksUrl }}{{ .Values.config.oidc.jwksUrl | quote }}{{ else }}null{{ end }},
        "clock_skew_seconds": {{ .Values.config.oidc.clockSkewSeconds }},
        "user_claim": {{ .Values.config.oidc.userClaim | quote }},
        "email_claim": {{ .Values.config.oidc.emailClaim | quote }},
        "role_claim": {{ .Values.config.oidc.roleClaim | quote }},
        "project_claim": {{ .Values.config.oidc.projectClaim | quote }},
        "admin_roles": {{ .Values.config.oidc.adminRoles | toJson }}
      },
      "jupyterhub": {
        "enabled": {{ .Values.config.jupyterhub.enabled }},
        "api_url": {{ if .Values.config.jupyterhub.apiUrl }}{{ .Values.config.jupyterhub.apiUrl | quote }}{{ else }}null{{ end }},
        "hub_url": {{ if .Values.config.jupyterhub.hubUrl }}{{ .Values.config.jupyterhub.hubUrl | quote }}{{ else }}null{{ end }},
        "service_name": {{ .Values.config.jupyterhub.serviceName | quote }},
        "service_prefix": {{ .Values.config.jupyterhub.servicePrefix | quote }},
        "public_url": {{ if .Values.config.jupyterhub.publicUrl }}{{ .Values.config.jupyterhub.publicUrl | quote }}{{ else }}null{{ end }},
        "service_token_env": {{ .Values.config.jupyterhub.serviceTokenEnv | quote }},
        "request_timeout_seconds": {{ .Values.config.jupyterhub.requestTimeoutSeconds }},
        "cache_ttl_seconds": {{ .Values.config.jupyterhub.cacheTtlSeconds }},
        "allowed_users": {{ .Values.config.jupyterhub.allowedUsers | toJson }},
        "allowed_groups": {{ .Values.config.jupyterhub.allowedGroups | toJson }},
        "admin_groups": {{ .Values.config.jupyterhub.adminGroups | toJson }},
        "viewer_groups": {{ .Values.config.jupyterhub.viewerGroups | toJson }},
        "project_groups": {{ .Values.config.jupyterhub.projectGroups | toJson }},
        "default_project_id": {{ if .Values.config.jupyterhub.defaultProjectId }}{{ .Values.config.jupyterhub.defaultProjectId | quote }}{{ else }}null{{ end }}
      }
      {{- if .Values.config.projectSettingsPath }},
      "project": "{{ .Values.config.projectSettingsPath }}"
      {{- end }}
    }
  goblin-resource-policies.json: |
{{ .Values.resourcePolicies | toPrettyJson | indent 4 }}
