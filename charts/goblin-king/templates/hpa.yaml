{{- $root := . -}}
{{- range $component := list "api" "scheduler" "admin" "repository" }}
{{- $settings := index $root.Values $component }}
{{- if and (or (ne $component "scheduler") $root.Values.scheduler.enabled) (or (ne $component "admin") $root.Values.admin.enabled) (or (ne $component "repository") $root.Values.repository.enabled) $settings.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "goblin-king.fullname" $root }}-{{ $component }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "goblin-king.fullname" $root }}-{{ $component }}
  minReplicas: {{ $settings.autoscaling.minReplicas }}
  maxReplicas: {{ $settings.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $settings.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
