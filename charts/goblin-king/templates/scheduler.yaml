{{- if .Values.scheduler.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "goblin-king.fullname" . }}-scheduler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "goblin-king.fullname" . }}-scheduler
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete", "get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "goblin-king.fullname" . }}-scheduler
subjects:
  - kind: ServiceAccount
    name: {{ include "goblin-king.fullname" . }}-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "goblin-king.fullname" . }}-scheduler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "goblin-king.fullname" . }}-scheduler
spec:
  replicas: {{ .Values.scheduler.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: scheduler
      app.kubernetes.io/name: {{ include "goblin-king.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: scheduler
        app.kubernetes.io/name: {{ include "goblin-king.name" . }}
    spec:
      serviceAccountName: {{ include "goblin-king.fullname" . }}-scheduler
      containers:
        - name: scheduler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          command:
            - goblin-king
            - scheduler
            - run
            - --runtime
            - {{ .Values.scheduler.runtime }}
            - --registry
            - {{ .Values.config.registryPath }}
            - --images
            - {{ .Values.config.imagesPath }}
            - --db
            - {{ .Values.config.dbPath }}
            - --redis-url
            - {{ .Values.config.redisUrl }}
            - --interval-seconds
            - "{{ .Values.scheduler.intervalSeconds }}"
      volumes:
        - name: config
          configMap:
            name: {{ include "goblin-king.fullname" . }}-config
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "goblin-king.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
