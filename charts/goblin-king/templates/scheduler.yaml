{{- if and .Values.scheduler.enabled .Values.scheduler.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "goblin-king.serviceAccountName" (dict "root" . "component" "scheduler") }}
  {{- with .Values.scheduler.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- if .Values.scheduler.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "goblin-king.fullname" . }}-scheduler
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete", "get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "goblin-king.fullname" . }}-scheduler
subjects:
  - kind: ServiceAccount
    name: {{ include "goblin-king.serviceAccountName" (dict "root" . "component" "scheduler") }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "goblin-king.fullname" . }}-scheduler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "goblin-king.fullname" . }}-scheduler
spec:
  {{- if not .Values.scheduler.autoscaling.enabled }}
  replicas: {{ .Values.scheduler.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: scheduler
      app.kubernetes.io/name: {{ include "goblin-king.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: scheduler
        app.kubernetes.io/name: {{ include "goblin-king.name" . }}
    spec:
      serviceAccountName: {{ include "goblin-king.serviceAccountName" (dict "root" . "component" "scheduler") }}
      {{- include "goblin-king.imagePullSecrets" . | nindent 6 }}
      {{- include "goblin-king.podSecurityContext" . | nindent 6 }}
      containers:
        - name: scheduler
          image: {{ include "goblin-king.controlPlaneImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "goblin-king.containerSecurityContext" . | nindent 10 }}
          {{- with .Values.scheduler.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            {{- with .Values.project.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          command:
            - goblin-king
            - scheduler
            - run
            - --runtime
            - {{ .Values.scheduler.runtime }}
            {{- if eq .Values.scheduler.runtime "kubernetes" }}
            - --result-forwarder-image
            - {{ include "goblin-king.resultForwarderImage" . | quote }}
            - --worker-image-pull-policy
            - {{ include "goblin-king.workerImagePullPolicy" . | quote }}
            - --result-forwarder-image-pull-policy
            - {{ include "goblin-king.resultForwarderImagePullPolicy" . | quote }}
            {{- range (include "goblin-king.workloadImagePullSecretNames" . | fromJsonArray) }}
            - --workload-image-pull-secret
            - {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.config.projectSettingsPath }}
            - --project
            - {{ .Values.config.projectSettingsPath }}
            {{- end }}
            - --registry
            - {{ .Values.config.registryPath }}
            - --images
            - {{ .Values.config.imagesPath }}
            - --db
            - {{ .Values.config.dbPath }}
            - --redis-url
            - {{ .Values.config.redisUrl }}
            - --resource-policies
            - {{ .Values.config.resourcePoliciesPath }}
            - --interval-seconds
            - "{{ .Values.scheduler.intervalSeconds }}"
      volumes:
        - name: config
          configMap:
            name: {{ include "goblin-king.fullname" . }}-config
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "goblin-king.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.project.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- include "goblin-king.podPlacement" .Values.scheduler | nindent 6 }}
{{- end }}
