apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "goblin-king.fullname" . }}-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: redis
      app.kubernetes.io/name: {{ include "goblin-king.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: redis
        app.kubernetes.io/name: {{ include "goblin-king.name" . }}
    spec:
      {{- include "goblin-king.podSecurityContext" . | nindent 6 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          {{- include "goblin-king.containerSecurityContext" . | nindent 10 }}
          ports:
            - containerPort: {{ .Values.redis.port }}
          {{- with .Values.redis.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- include "goblin-king.podPlacement" .Values.redis | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "goblin-king.fullname" . }}-redis
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis
    app.kubernetes.io/name: {{ include "goblin-king.name" . }}
  ports:
    - name: redis
      port: {{ .Values.redis.port }}
      targetPort: {{ .Values.redis.port }}
