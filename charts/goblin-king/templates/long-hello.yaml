{{- if .Values.workers.exampleLongHello.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "goblin-king.fullname" . }}-long-hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: long-hello
      app.kubernetes.io/name: {{ include "goblin-king.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: long-hello
        app.kubernetes.io/name: {{ include "goblin-king.name" . }}
    spec:
      {{- include "goblin-king.imagePullSecrets" . | nindent 6 }}
      {{- include "goblin-king.podSecurityContext" . | nindent 6 }}
      containers:
        - name: long-hello
          image: {{ .Values.workers.exampleLongHello.image }}
          imagePullPolicy: {{ .Values.workers.exampleLongHello.pullPolicy }}
          {{- include "goblin-king.containerSecurityContext" . | nindent 10 }}
          ports:
            - containerPort: {{ .Values.workers.exampleLongHello.port }}
          env:
            - name: GOBLIN_WORKER_ID
              value: example-long-hello-k8s
          {{- with .Values.workers.exampleLongHello.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- include "goblin-king.podPlacement" .Values.workers.exampleLongHello | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "goblin-king.fullname" . }}-long-hello
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: long-hello
    app.kubernetes.io/name: {{ include "goblin-king.name" . }}
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.workers.exampleLongHello.port }}
{{- end }}
{{- range .Values.workers.extraLongServices }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "goblin-king.fullname" $ }}-{{ .name }}
spec:
  replicas: {{ default 1 .replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ .name }}
      app.kubernetes.io/name: {{ include "goblin-king.name" $ }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ .name }}
        app.kubernetes.io/name: {{ include "goblin-king.name" $ }}
    spec:
      {{- include "goblin-king.imagePullSecrets" $ | nindent 6 }}
      {{- include "goblin-king.podSecurityContext" $ | nindent 6 }}
      containers:
        - name: {{ .name }}
          image: {{ .image }}
          imagePullPolicy: {{ default "IfNotPresent" .pullPolicy }}
          {{- include "goblin-king.containerSecurityContext" $ | nindent 10 }}
          ports:
            - containerPort: {{ default 8080 .port }}
          env:
            - name: GOBLIN_WORKER_ID
              value: {{ default .name .workerId | quote }}
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- include "goblin-king.podPlacement" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "goblin-king.fullname" $ }}-{{ .name }}
spec:
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ .name }}
    app.kubernetes.io/name: {{ include "goblin-king.name" $ }}
  ports:
    - name: http
      port: 80
      targetPort: {{ default 8080 .port }}
{{- end }}
