{{- if .Values.admin.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "goblin-king.fullname" . }}-admin
spec:
  {{- if not .Values.admin.autoscaling.enabled }}
  replicas: {{ .Values.admin.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: admin
      app.kubernetes.io/name: {{ include "goblin-king.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: admin
        app.kubernetes.io/name: {{ include "goblin-king.name" . }}
    spec:
      serviceAccountName: {{ include "goblin-king.serviceAccountName" (dict "root" . "component" "admin") }}
      {{- include "goblin-king.imagePullSecrets" . | nindent 6 }}
      {{- include "goblin-king.podSecurityContext" . | nindent 6 }}
      containers:
        - name: admin
          image: "{{ .Values.admin.image.repository }}:{{ .Values.admin.image.tag }}"
          imagePullPolicy: {{ .Values.admin.image.pullPolicy }}
          {{- include "goblin-king.containerSecurityContext" . | nindent 10 }}
          ports:
            - containerPort: {{ .Values.admin.port }}
          env:
            - name: API_UPSTREAM
              value: '{{ include "goblin-king.fullname" . }}-api:{{ .Values.api.port }}'
            - name: DEPLOYMENT_SCOPE
              value: kubernetes
            - name: LONG_HELLO_URL
              value: {{ .Values.admin.longHelloUrl | quote }}
          {{- with .Values.admin.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- include "goblin-king.podPlacement" .Values.admin | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "goblin-king.fullname" . }}-admin
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: admin
    app.kubernetes.io/name: {{ include "goblin-king.name" . }}
  ports:
    - name: http
      port: {{ .Values.admin.port }}
      targetPort: {{ .Values.admin.port }}
{{- end }}
