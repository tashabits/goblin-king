{{- $repositoryUrl := include "goblin-king.repositoryUrl" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "goblin-king.fullname" . }}-api
spec:
  {{- if eq .Values.persistence.topology "sqlite-single-node" }}
  strategy:
    type: Recreate
  {{- end }}
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
      app.kubernetes.io/name: {{ include "goblin-king.name" . }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
        app.kubernetes.io/name: {{ include "goblin-king.name" . }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "goblin-king.serviceAccountName" (dict "root" . "component" "api") }}
      {{- include "goblin-king.imagePullSecrets" . | nindent 6 }}
      {{- include "goblin-king.podSecurityContext" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "goblin-king.controlPlaneImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "goblin-king.containerSecurityContext" . | nindent 10 }}
          ports:
            - containerPort: {{ .Values.api.port }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            periodSeconds: 10
          env:
            - name: GOBLIN_KING_BOOTSTRAP_ADMIN_TOKEN
              {{- if .Values.pipeline.enabled }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pipeline.authSecret }}
                  key: api-token
              {{- else if .Values.api.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.existingSecret }}
                  key: {{ .Values.api.existingSecretBootstrapTokenKey }}
              {{- else }}
              value: {{ .Values.api.bootstrapAdminToken | quote }}
              {{- end }}
            - name: GOBLIN_KING_REPOSITORY_ENABLED
              value: {{ .Values.repository.enabled | quote }}
            {{- if $repositoryUrl }}
            - name: GOBLIN_KING_REPOSITORY_URL
              value: {{ $repositoryUrl | quote }}
            {{- end }}
            - name: GOBLIN_KING_K8S_ARTIFACT_URI_ROOT
              value: {{ .Values.config.artifactRoot | quote }}
            {{- if and .Values.persistence.enabled (not .Values.pipeline.enabled) }}
            - name: GOBLIN_KING_K8S_ARTIFACT_PVC_CLAIM
              value: {{ include "goblin-king.fullname" . }}-data
            - name: GOBLIN_KING_K8S_ARTIFACT_VOLUME_SUBDIRECTORY
              value: {{ .Values.persistence.artifactSubdirectory | quote }}
            {{- end }}
            {{- if and .Values.config.jupyterhub.enabled .Values.config.jupyterhub.serviceTokenSecret.name }}
            - name: {{ .Values.config.jupyterhub.serviceTokenEnv }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.jupyterhub.serviceTokenSecret.name }}
                  key: {{ .Values.config.jupyterhub.serviceTokenSecret.key }}
            {{- end }}
            {{- if .Values.pipeline.enabled }}
            - name: GOBLIN_KING_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pipeline.authSecret }}
                  key: redis-url
            {{- end }}
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.pipeline.enabled }}
            - name: pipeline-github
              mountPath: /var/run/pipeline/github
              readOnly: true
            - name: pipeline-registry-reader
              mountPath: /var/run/pipeline/registry
              readOnly: true
            {{- if .Values.pipeline.notificationSecret }}
            - name: pipeline-notification
              mountPath: /var/run/pipeline/notification
              readOnly: true
            {{- end }}
            {{- end }}
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            {{- with .Values.project.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          command:
            - goblin-king
            - api
            - run
            - --settings
            - /config/goblin-king-api.json
            - --host
            - 0.0.0.0
            - --port
            - "{{ .Values.api.port }}"
      volumes:
        {{- if .Values.pipeline.enabled }}
        {{- if .Values.pipeline.notificationSecret }}
        - name: pipeline-notification
          secret:
            secretName: {{ .Values.pipeline.notificationSecret }}
        {{- end }}
        - name: pipeline-github
          secret:
            secretName: {{ .Values.pipeline.githubSecret }}
        - name: pipeline-registry-reader
          secret:
            secretName: {{ .Values.pipeline.registryReaderSecret }}
        {{- end }}
        - name: config
          configMap:
            name: {{ include "goblin-king.fullname" . }}-config
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "goblin-king.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.project.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- include "goblin-king.storagePlacement" (dict "root" . "component" "api") | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "goblin-king.fullname" . }}-api
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
    app.kubernetes.io/name: {{ include "goblin-king.name" . }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
