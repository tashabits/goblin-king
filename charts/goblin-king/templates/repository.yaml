{{- if .Values.repository.enabled }}
{{- $repositoryUrl := include "goblin-king.repositoryUrl" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "goblin-king.fullname" . }}-repository
spec:
  {{- if not .Values.repository.autoscaling.enabled }}
  replicas: {{ .Values.repository.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: repository
      app.kubernetes.io/name: {{ include "goblin-king.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: repository
        app.kubernetes.io/name: {{ include "goblin-king.name" . }}
        {{- with .Values.repository.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "goblin-king.serviceAccountName" (dict "root" . "component" "repository") }}
      {{- include "goblin-king.imagePullSecrets" . | nindent 6 }}
      {{- include "goblin-king.podSecurityContext" . | nindent 6 }}
      containers:
        - name: repository
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "goblin-king.containerSecurityContext" . | nindent 10 }}
          ports:
            - containerPort: {{ .Values.repository.port }}
          env:
            - name: GOBLIN_KING_BOOTSTRAP_ADMIN_TOKEN
              {{- if .Values.api.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.existingSecret }}
                  key: {{ .Values.api.existingSecretBootstrapTokenKey }}
              {{- else }}
              value: {{ .Values.api.bootstrapAdminToken | quote }}
              {{- end }}
            - name: GOBLIN_KING_REPOSITORY_ENABLED
              value: "true"
            {{- if $repositoryUrl }}
            - name: GOBLIN_KING_REPOSITORY_URL
              value: {{ $repositoryUrl | quote }}
            {{- end }}
            {{- if and .Values.config.jupyterhub.enabled .Values.config.jupyterhub.serviceTokenSecret.name }}
            - name: {{ .Values.config.jupyterhub.serviceTokenEnv }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.jupyterhub.serviceTokenSecret.name }}
                  key: {{ .Values.config.jupyterhub.serviceTokenSecret.key }}
            {{- end }}
          {{- with .Values.repository.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            {{- with .Values.project.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          command:
            - goblin-king
            - api
            - run
            - --settings
            - /config/goblin-king-api.json
            - --host
            - 0.0.0.0
            - --port
            - "{{ .Values.repository.port }}"
      volumes:
        - name: config
          configMap:
            name: {{ include "goblin-king.fullname" . }}-config
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "goblin-king.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.project.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- include "goblin-king.podPlacement" .Values.repository | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "goblin-king.fullname" . }}-repository
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: repository
    app.kubernetes.io/name: {{ include "goblin-king.name" . }}
  ports:
    - name: http
      port: {{ .Values.repository.port }}
      targetPort: {{ .Values.repository.port }}
{{- end }}
