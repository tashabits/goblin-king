services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  scheduler:
    image: goblin-king:local
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["scheduler"]
    working_dir: /app
    depends_on:
      - redis
    environment:
      GOBLIN_KING_DOCKER_DATA_VOLUME: ${COMPOSE_PROJECT_NAME:-goblin-king}_goblin-king-data
      GOBLIN_KING_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-goblin-king}_default
    volumes:
      - .:/app
      - goblin-king-data:/app/.goblin-king
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - scheduler
      - run
      - --registry
      - demo-goblins.json
      - --images
      - demo-images.json
      - --db
      - .goblin-king/goblin-king.sqlite3
      - --redis-url
      - redis://redis:6379/0

  scheduler-run-once:
    image: goblin-king:local
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["run-once"]
    working_dir: /app
    depends_on:
      - redis
    environment:
      GOBLIN_KING_DOCKER_DATA_VOLUME: ${COMPOSE_PROJECT_NAME:-goblin-king}_goblin-king-data
      GOBLIN_KING_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-goblin-king}_default
    volumes:
      - .:/app
      - goblin-king-data:/app/.goblin-king
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - scheduler
      - run-once
      - --registry
      - demo-goblins.json
      - --images
      - demo-images.json
      - --db
      - .goblin-king/goblin-king.sqlite3
      - --redis-url
      - redis://redis:6379/0

  api:
    image: goblin-king:local
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["api"]
    working_dir: /app
    entrypoint: []
    depends_on:
      - redis
    ports:
      - "8000:8000"
    environment:
      GOBLIN_KING_API_TOKEN: local-dev-token
      GOBLIN_KING_DOCKER_DATA_VOLUME: ${COMPOSE_PROJECT_NAME:-goblin-king}_goblin-king-data
      GOBLIN_KING_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-goblin-king}_default
      GOBLIN_KING_NOTEBOOK_SERVICE_RUNTIME: docker
      GOBLIN_KING_REPOSITORY_ENABLED: ${GOBLIN_REPOSITORY_ENABLED:-false}
      GOBLIN_KING_REPOSITORY_URL: ${GOBLIN_KING_REPOSITORY_URL:-http://repository:8000}
    volumes:
      - .:/app
      - goblin-king-data:/app/.goblin-king
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - sh
      - -c
      - >
        pip install -e . &&
        goblin-king api run
        --settings goblin-king-api.json
        --host 0.0.0.0
        --port 8000

  admin:
    image: goblin-king-admin-ui:local
    profiles: ["admin"]
    build:
      context: admin-ui
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      API_UPSTREAM: api:8000
      DEPLOYMENT_SCOPE: docker-compose
      LONG_HELLO_URL: http://long-hello:8080
    ports:
      - "8080:8080"

  repository:
    image: goblin-king:local
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["repository"]
    working_dir: /app
    entrypoint: []
    depends_on:
      - redis
    ports:
      - "8010:8000"
    environment:
      GOBLIN_KING_API_TOKEN: local-dev-token
      GOBLIN_KING_BOOTSTRAP_ADMIN_TOKEN: local-dev-token
      GOBLIN_KING_DOCKER_DATA_VOLUME: ${COMPOSE_PROJECT_NAME:-goblin-king}_goblin-king-data
      GOBLIN_KING_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-goblin-king}_default
      GOBLIN_KING_NOTEBOOK_SERVICE_RUNTIME: docker
      GOBLIN_KING_REPOSITORY_ENABLED: "true"
      GOBLIN_KING_REPOSITORY_URL: ${GOBLIN_KING_REPOSITORY_URL:-http://repository:8000}
    volumes:
      - .:/app
      - goblin-king-data:/app/.goblin-king
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - sh
      - -c
      - >
        pip install -e . &&
        goblin-king api run
        --settings goblin-king-api.json
        --host 0.0.0.0
        --port 8000

  worker-example-echo:
    image: goblin-king-example-echo:local
    profiles: ["workers"]
    build:
      context: workers/example.echo
      dockerfile: Dockerfile
    command: ["python", "-c", "print('example.echo worker image built')"]

  worker-example-hello:
    image: goblin-king-example-hello:local
    profiles: ["workers"]
    build:
      context: workers/example.hello
      dockerfile: Dockerfile
    command: ["python", "-c", "print('example.hello worker image built')"]

  worker-example-artifact:
    image: goblin-king-example-artifact:local
    profiles: ["workers"]
    build:
      context: workers/example.artifact
      dockerfile: Dockerfile
    command: ["python", "-c", "print('example.artifact worker image built')"]

  worker-example-environment:
    image: goblin-king-example-environment:local
    profiles: ["workers"]
    build:
      context: workers/example.environment
      dockerfile: Dockerfile
    command: ["python", "-c", "print('example.environment worker image built')"]

  worker-example-controlled-failure:
    image: goblin-king-example-controlled-failure:local
    profiles: ["workers"]
    build:
      context: workers/example.controlled-failure
      dockerfile: Dockerfile
    command: ["python", "-c", "print('example.controlled-failure worker image built')"]

  worker-example-progress:
    image: goblin-king-example-progress:local
    profiles: ["workers"]
    build:
      context: workers/example.progress
      dockerfile: Dockerfile
    command: ["python", "-c", "print('example.progress worker image built')"]

  worker-notebook-python-function:
    image: goblin-king-notebook-python-function:local
    profiles: ["workers"]
    build:
      context: workers/notebook.python-function
      dockerfile: Dockerfile
    command: ["python", "-c", "print('notebook.python-function worker image built')"]

  worker-notebook-asgi-service:
    image: goblin-king-notebook-asgi-service:local
    profiles: ["workers"]
    build:
      context: workers/notebook.asgi-service
      dockerfile: Dockerfile
    command: ["python", "-c", "print('notebook.asgi-service worker image built')"]

  long-hello:
    image: goblin-king-example-long-hello:local
    profiles: ["admin"]
    build:
      context: workers/example.long-hello
      dockerfile: Dockerfile
    ports:
      - "8090:8080"
    environment:
      GOBLIN_WORKER_ID: example-long-hello-compose

volumes:
  goblin-king-data:
